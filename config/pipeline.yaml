# Settings shared by the whole pipeline.
# All randomness (splits, models, sampling) must use this seed so that the same
# data and configuration always give the same metrics.
seed: 42

# Shares of the cases, ordered by start time (oldest cases are used for training).
split:
  train: 0.70
  validation: 0.15
  test: 0.15

# Column that names who works on an event, used to count reassignments.
features:
  reassignment_field: "org:resource"

ridge:
  alpha: 1.0
